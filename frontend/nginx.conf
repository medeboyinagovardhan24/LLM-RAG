server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Static assets; fall back to index.html for unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy API calls to the backend service on the compose network.
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Stream SSE events to the browser instead of buffering the full answer.
        proxy_buffering    off;

        # Allow PDF uploads with headroom over the backend's 20 MB limit.
        client_max_body_size 25m;
        proxy_read_timeout   120s;
        proxy_send_timeout   120s;
    }
}
